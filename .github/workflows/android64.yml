name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Optimizer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
